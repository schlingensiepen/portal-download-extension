<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 1. Blauer Hintergrund -->
  <rect x="16" y="16" width="480" height="480" rx="105" fill="#1B5BA6" />

  <!-- 2. HINTERE EBENE (Mitte oben): Große grüne Wolke -->
  <path d="M 166,245 L 346,245 A 54,54 0 0,0 346,137 A 74,74 0 0,0 205,120 A 60,60 0 0,0 166,245 Z"
        fill="#1B5BA6" stroke="#3CC2B0" stroke-width="22" stroke-linejoin="round" />
  <!-- Mittlerer Pfeil (führt frei durch die Lücke zwischen gelber und roter Wolke) -->
  <path d="M 244,230 L 268,230 L 268,310 L 288,310 L 256,352 L 224,310 L 244,310 Z"
        fill="#FFFFFF" stroke="#1B5BA6" stroke-width="12" stroke-linejoin="round" paint-order="stroke" />

  <!-- 3. MITTLERE EBENE (Rechts, etwas tiefer): Rote Wolke -->
  <path d="M 312,300 L 424,300 A 35,35 0 0,0 424,230 A 48,48 0 0,0 332,219 A 39,39 0 0,0 312,300 Z"
        fill="#1B5BA6" stroke="#7FD8E6" stroke-width="20" stroke-linejoin="round" />
  <!-- Rechter Pfeil -->
  <path d="M 358,288 L 378,288 L 378,342 L 394,342 L 368,376 L 342,342 L 358,342 Z"
        fill="#FFFFFF" stroke="#1B5BA6" stroke-width="12" stroke-linejoin="round" paint-order="stroke" />

  <!-- 4. VORDERE EBENE (Links, am tiefsten): Gelbe Wolke -->
  <path d="M 88,335 L 200,335 A 35,35 0 0,0 200,265 A 48,48 0 0,0 108,254 A 39,39 0 0,0 88,335 Z"
        fill="#1B5BA6" stroke="#B8EBD9" stroke-width="20" stroke-linejoin="round" />
  <!-- Linker Pfeil -->
  <path d="M 134,323 L 154,323 L 154,377 L 170,377 L 144,411 L 118,377 L 134,377 Z"
        fill="#FFFFFF" stroke="#1B5BA6" stroke-width="12" stroke-linejoin="round" paint-order="stroke" />
</svg>
