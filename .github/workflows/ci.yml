name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
env:
  # The service whose contract scenarios the local backend passes; same major and minor version.
  PRODUCT_REF: v0.9.0
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Contract scenarios of the service
        run: git clone --depth 1 --branch "$PRODUCT_REF" https://github.com/schlingensiepen/portal-download.git product
      - run: node test/contract.mjs product/contract-tests
      - run: node test/zip.test.mjs
      - run: node test/messages.test.mjs
      - run: node test/i18n.test.mjs
      - run: node test/vault.test.mjs
      - run: node build.mjs
      - name: Lint as Firefox's add-on checker does
        run: |
          mkdir -p dist/unpacked && cd dist/unpacked && unzip -q ../portal-download-*.zip
          npx --yes web-ext@10.7.0 lint --source-dir .
      - uses: actions/upload-artifact@v4
        with: { name: extension, path: "dist/portal-download-*.zip" }
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: The tag names the version of the manifest
        run: |
          v=$(node -p 'require("./manifest.json").version')
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "::error::tag $GITHUB_REF_NAME, manifest version $v"; exit 1; }
      - run: node build.mjs
      - name: Firefox – submitted to addons.mozilla.org (listed)
        id: amo
        # Mozilla reviews listed versions; the signed file comes back only once approved, within
        # the wait. A refusal or a longer review must not hold up the release for Chrome and Edge.
        continue-on-error: true
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then echo "::error::the secrets AMO_JWT_ISSUER and AMO_JWT_SECRET are missing"; exit 1; fi
          mkdir -p dist/unpacked && cd dist/unpacked && unzip -q ../portal-download-*.zip
          npx --yes web-ext@10.7.0 sign --channel listed --amo-metadata ../../store/amo-metadata.json --source-dir . --artifacts-dir ../signed --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
      - name: Release, with the signed file when Mozilla returned it
        env: { GH_TOKEN: "${{ github.token }}", AMO: "${{ steps.amo.outcome }}" }
        run: |
          v=$(node -p 'require("./manifest.json").version')
          files="dist/portal-download-$v.zip"
          firefox="Firefox 140 or newer – install it from addons.mozilla.org (search for Portal-Download) once Mozilla has reviewed this version."
          if ls dist/signed/*.xpi >/dev/null 2>&1; then
            mv dist/signed/*.xpi "dist/portal-download-$v.xpi"; files="$files dist/portal-download-$v.xpi"
            firefox="Firefox 140 or newer – install it from addons.mozilla.org, or download the .xpi, then about:addons, gear menu, Install Add-on From File."
          fi
          [ "$AMO" = success ] || echo "::warning::the submission to addons.mozilla.org failed; see the step above"
          # Checksums beside the files, to compare a download with what the CI built.
          # shellcheck disable=SC2086
          (cd dist && sha256sum $(for f in $files; do basename "$f"; done) > SHA256SUMS); files="$files dist/SHA256SUMS"; cat dist/SHA256SUMS
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" $files --title "$GITHUB_REF_NAME" \
            --notes "$firefox Chrome and Edge 121 or newer – unpack the ZIP into a folder that stays and load it under Extensions, Developer mode, Load unpacked. Details in the README."
