name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
env:
  # The service whose contract scenarios the local backend passes; same major and minor version.
  PRODUCT_REF: release-0.8
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Contract scenarios of the service
        run: git clone --depth 1 --branch "$PRODUCT_REF" https://github.com/schlingensiepen/portal-download.git product
      - run: node test/contract.mjs product/contract-tests
      - run: node test/zip.test.mjs
      - run: node test/messages.test.mjs
      - run: node build.mjs
      - name: Lint as Firefox's add-on checker does
        run: |
          mkdir -p dist/unpacked && cd dist/unpacked && unzip -q ../portal-download-*.zip
          npx --yes web-ext@8.3.0 lint --self-hosted --source-dir .
      - uses: actions/upload-artifact@v4
        with: { name: extension, path: "dist/portal-download-*.zip" }
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node build.mjs
      - name: Signed file for Firefox (unlisted on addons.mozilla.org)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then echo "::error::the secrets AMO_JWT_ISSUER and AMO_JWT_SECRET are missing"; exit 1; fi
          mkdir -p dist/unpacked && cd dist/unpacked && unzip -q ../portal-download-*.zip
          npx --yes web-ext@8.3.0 sign --channel unlisted --source-dir . --artifacts-dir ../signed --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
      - name: Release with both files
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "$GITHUB_REF_NAME" dist/portal-download-*.zip dist/signed/*.xpi --title "$GITHUB_REF_NAME" \
            --notes "Chrome and Edge – unpack the ZIP and load it under Extensions, Developer mode, Load unpacked. Firefox – open the .xpi file."
